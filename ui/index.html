<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DoubaoIME ThemeTool</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <header>
        <h1>DoubaoIME <span class="mark">ThemeTool</span></h1>
        <p class="lede">
          <span>输入法皮肤小助手</span>
          <span id="workdir-tip" class="ime-tip" aria-label="默认缓存目录">
            <svg class="ime-tip-icon" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
              <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2" />
              <line x1="12" x2="12" y1="8" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
              <line x1="12" x2="12.01" y1="16" y2="16" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
            <span id="workdir-tip-text" class="ime-tip-bubble" role="tooltip"></span>
          </span>
        </p>
      </header>

      <div class="preview-block">
      <div class="preview-meta">
        <div class="status-line">
          <p id="ime-state" class="plugin-state off" aria-live="polite">
            <span class="dot" aria-hidden="true"></span>
            <span id="ime-version-tip" class="ime-tip is-off" tabindex="0" aria-describedby="ime-version-tip-text">
              <span id="ime-state-text">检测中…</span>
              <span id="ime-version-tip-text" class="ime-tip-bubble" role="tooltip"></span>
            </span>
          </p>
          <p id="plugin-state" class="plugin-state off" aria-live="polite">
            <span class="dot" aria-hidden="true"></span>
            <span id="plugin-theme-tip" class="ime-tip is-off" tabindex="-1" aria-describedby="plugin-theme-tip-text">
              <span id="plugin-state-text">检测中…</span>
              <span id="plugin-theme-tip-text" class="ime-tip-bubble" role="tooltip"></span>
            </span>
          </p>
        </div>
        <span class="preview-bg-wrap">
          <span id="preview-bg-flash" class="preview-bg-flash" aria-hidden="true">
            <svg class="flash-sun" viewBox="0 0 24 24" width="16" height="16">
              <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2" />
              <path d="M12 2v2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
              <path d="M12 20v2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
              <path d="m4.9 4.9 1.4 1.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
              <path d="m17.7 17.7 1.4 1.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
              <path d="M2 12h2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
              <path d="M20 12h2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
              <path d="m6.3 17.7-1.4 1.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
              <path d="m19.1 4.9-1.4 1.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
            <svg class="flash-moon" viewBox="0 0 24 24" width="16" height="16">
              <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </span>
          <button type="button" id="btn-preview-bg" class="preview-bg-toggle" aria-pressed="false" aria-label="切换预览底色">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <path d="M12 8a2.83 2.83 0 0 0 4 4 4 4 0 1 1-4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
              <path d="M12 2v2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
              <path d="M12 20v2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
              <path d="m4.9 4.9 1.4 1.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
              <path d="m17.7 17.7 1.4 1.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
              <path d="M2 12h2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
              <path d="M20 12h2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
              <path d="m6.3 17.7-1.4 1.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
              <path d="m19.1 4.9-1.4 1.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
          </button>
        </span>
      </div>
      <section class="preview" aria-label="预览">
        <div id="preview-toolbar" class="toolbar" hidden>
          <img id="toolbar-bg" class="toolbar-bg" alt="" />
          <div class="toolbar-row">
            <span class="toolbar-logo-slot"><img id="toolbar-logo" class="toolbar-logo" alt="" hidden /></span>
            <img id="toolbar-divider" class="toolbar-divider" alt="" />
            <img id="toolbar-mic" class="toolbar-icon" alt="" />
            <img id="toolbar-lang" class="toolbar-icon" alt="" />
            <img id="toolbar-punct" class="toolbar-icon" alt="" />
            <img id="toolbar-half" class="toolbar-icon" alt="" />
          </div>
        </div>
        <div class="bar-frame">
          <div id="preview-bar" class="bar">
            <span class="chip on"><i>1</i><span id="greet-word">早上好</span></span>
            <span class="chip"><i>2</i>hello</span>
            <span class="chip"><i>3</i><span id="kaomoji-word">ε = = (づ′▽`)づ</span></span>
            <span class="more" aria-hidden="true">
              <svg viewBox="0 0 20 20" width="20" height="20">
                <path d="M4.96436 7.5L9.9999 12.5L15.0354 7.5" fill="none" stroke="currentColor" stroke-opacity="0.72" stroke-width="1.30125" stroke-linejoin="round" />
              </svg>
            </span>
          </div>
        </div>
      </section>
      </div>

      <div class="control-row theme-row">
        <div class="field field-inline">
          <svg class="field-glyph" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <path d="M12 22a1 1 0 0 1 0-20 10 9 0 0 1 10 9 5 5 0 0 1-5 5h-2.25a1.75 1.75 0 0 0-1.4 2.8l.3.4a1.75 1.75 0 0 1-1.4 2.8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            <circle cx="13.5" cy="6.5" r=".5" fill="currentColor" />
            <circle cx="17.5" cy="10.5" r=".5" fill="currentColor" />
            <circle cx="6.5" cy="12.5" r=".5" fill="currentColor" />
            <circle cx="8.5" cy="7.5" r=".5" fill="currentColor" />
          </svg>
          <div class="combo" id="combo-theme">
            <input id="theme-select" type="text" autocomplete="off" spellcheck="false" placeholder="Dark / Light / Midlight" aria-label="主题" />
            <button
              id="theme-toggle"
              class="combo-toggle"
              type="button"
              tabindex="-1"
              aria-label="显示全部主题"
              aria-haspopup="listbox"
              aria-controls="theme-menu"
              aria-expanded="false"
            ></button>
            <div id="theme-menu" class="combo-menu" hidden>
              <ul class="combo-list" role="listbox"></ul>
            </div>
          </div>
        </div>
        <section id="custom-panel" class="field color-field">
          <div class="swatch-row" role="group" aria-label="主题色">
            <button type="button" class="swatch" id="swatch-accent" data-key="accent" aria-label="主题色" aria-haspopup="dialog" aria-expanded="false"></button>
            <button type="button" class="swatch" id="swatch-background" data-key="background" aria-label="背景色" aria-haspopup="dialog" aria-expanded="false"></button>
            <button type="button" class="swatch" id="swatch-foreground" data-key="foreground" aria-label="字体颜色" aria-haspopup="dialog" aria-expanded="false"></button>
            <button type="button" class="swatch" id="swatch-emphasis" data-key="emphasis" aria-label="强调色" aria-haspopup="dialog" aria-expanded="false"></button>
            <div class="theme-action-pop">
              <button type="button" id="btn-theme-save" class="theme-action" hidden aria-label="覆盖保存当前自定义主题" aria-haspopup="false" aria-expanded="false" aria-controls="btn-theme-add">
                <svg class="icon-save" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                  <path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                  <path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                  <path d="M7 3v4a1 1 0 0 0 1 1h7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <svg class="icon-save-check" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                  <path d="M12.5 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h10.2a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4v4.35" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                  <path d="M17 15.13V14a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                  <path d="M7 3v4a1 1 0 0 0 1 1h7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                  <path d="m16 19 2 2 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </button>
              <button type="button" id="btn-theme-add" class="theme-action" aria-label="新增自定义主题" aria-haspopup="false" aria-expanded="false">
                <svg class="icon-plus" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                  <path d="M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                  <path d="M12 5v14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                </svg>
                <svg class="icon-check" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                  <path d="M20 6 9 17l-5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </button>
            </div>
          </div>
        <div id="color-card" class="color-card" hidden role="dialog" aria-label="自定义颜色">
          <div class="color-card-head">
            <span id="color-preview" class="color-card-preview" aria-hidden="true"></span>
            <input id="color-hex" type="text" spellcheck="false" maxlength="7" aria-label="色号" />
            <button type="button" id="color-eyedrop" class="color-eyedrop" aria-label="吸管">
              <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
                <path d="m2 22 1-1h3l9-9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                <path d="M3 21v-3l9-9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                <path d="m15 6 3.4-3.4a2.1 2.1 0 1 1 3 3L18 9l-3-3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </button>
          </div>
          <div class="color-rgb">
            <label>R<input id="color-r" type="number" min="0" max="255" inputmode="numeric" /></label>
            <label>G<input id="color-g" type="number" min="0" max="255" inputmode="numeric" /></label>
            <label>B<input id="color-b" type="number" min="0" max="255" inputmode="numeric" /></label>
          </div>
          <div class="color-slider" aria-label="色相">
            <input id="color-h" type="range" min="0" max="360" step="1" />
          </div>
          <div class="color-slider" aria-label="饱和度">
            <input id="color-s" type="range" min="0" max="100" step="1" />
          </div>
          <div class="color-slider" aria-label="明暗度">
            <input id="color-l" type="range" min="0" max="100" step="1" />
          </div>
          <div class="color-card-store" hidden>
            <input id="accent" type="color" />
            <input id="accent-hex" type="text" maxlength="7" />
            <input id="background" type="color" />
            <input id="background-hex" type="text" maxlength="7" />
            <input id="foreground" type="color" />
            <input id="foreground-hex" type="text" maxlength="7" />
            <input id="emphasis" type="color" />
            <input id="emphasis-hex" type="text" maxlength="7" />
          </div>
        </div>
        </section>
      </div>

      <div class="control-row font-row">
        <div class="field field-inline">
          <svg class="field-glyph" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <path d="M4 7V4h16v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M9 20h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            <path d="M12 4v16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
          <div class="combo" id="combo-face">
            <input id="font-face" type="text" autocomplete="off" spellcheck="false" placeholder="搜索，支持拼音" aria-label="候选栏字体" />
            <button
              id="font-face-toggle"
              class="combo-toggle"
              type="button"
              tabindex="-1"
              aria-label="显示全部字体"
              aria-haspopup="listbox"
              aria-controls="font-face-menu"
              aria-expanded="false"
            ></button>
            <div id="font-face-menu" class="combo-menu" hidden>
              <ul class="combo-list" role="listbox"></ul>
            </div>
          </div>
        </div>
        <section id="glass-panel" class="field field-inline glass-field" aria-label="不透明度">
          <svg class="field-glyph" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <defs>
              <clipPath id="glass-grid-clip">
                <rect width="18" height="18" x="3" y="3" rx="2" />
              </clipPath>
            </defs>
            <g clip-path="url(#glass-grid-clip)">
              <rect x="3" y="3" width="9" height="9" fill="currentColor" />
              <rect x="12" y="12" width="9" height="9" fill="currentColor" />
            </g>
            <rect width="18" height="18" x="3" y="3" rx="2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <div class="glass-row">
            <label class="slider-row" aria-label="不透明度">
              <input id="glass-opacity" type="range" min="20" max="100" step="1" value="100" />
              <output id="glass-opacity-val" for="glass-opacity">100%</output>
            </label>
          </div>
        </section>
      </div>

      <div class="control-row action-row">
        <section class="icon-fields" aria-label="图标设置">
          <svg class="field-glyph icon-settings-glyph" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect width="18" height="18" x="3" y="3" rx="2" />
            <circle cx="9" cy="9" r="2" />
            <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21" />
          </svg>
          <div class="icon-field">
            <div class="icon-action-pop">
              <button id="btn-pick-logo" class="icon-picker" type="button" aria-label="选择工具栏图标">
                <img id="logo-picker-preview" alt="" hidden />
                <svg class="icon-placeholder" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                  <rect width="18" height="18" x="3" y="3" rx="2" fill="none" stroke="currentColor" stroke-width="1.7" />
                  <circle cx="9" cy="9" r="2" fill="none" stroke="currentColor" stroke-width="1.7" />
                  <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </button>
              <button id="btn-clear-logo" type="button" class="logo-reset" aria-label="恢复默认工具栏图标" title="恢复默认">
                <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                  <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8M3 3v5h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </button>
            </div>
            <span class="icon-label">工具栏</span>
            <input id="logo-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/bmp" hidden />
          </div>
          <div class="icon-field">
            <div class="icon-action-pop">
              <button id="btn-pick-taskbar-logo" class="icon-picker" type="button" aria-label="选择任务栏图标">
                <img id="taskbar-logo-picker-preview" alt="" hidden />
                <svg class="icon-placeholder" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                  <rect width="18" height="18" x="3" y="3" rx="2" fill="none" stroke="currentColor" stroke-width="1.7" />
                  <circle cx="9" cy="9" r="2" fill="none" stroke="currentColor" stroke-width="1.7" />
                  <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </button>
              <button id="btn-clear-taskbar-logo" type="button" class="logo-reset" aria-label="恢复默认任务栏图标" title="恢复默认">
                <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                  <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8M3 3v5h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </button>
            </div>
            <span class="icon-label">任务栏</span>
            <span id="taskbar-icon-tip" class="ime-tip" tabindex="0" aria-label="任务栏图标提示" aria-describedby="taskbar-icon-tip-text">
              <svg class="ime-tip-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="10" />
                <path d="M12 8v4m0 4h.01" />
              </svg>
              <span id="taskbar-icon-tip-text" class="ime-tip-bubble" role="tooltip">修改任务栏图标需重启资源管理器</span>
            </span>
            <input id="taskbar-logo-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/bmp" hidden />
          </div>
        </section>
        <div class="row-actions">
          <button id="btn-install" type="button">安装</button>
          <button id="btn-uninstall" type="button" class="ghost">卸载</button>
        </div>
      </div>
      <p id="status-note" class="status-note" role="status" hidden></p>
      <p id="error" class="error" role="alert" hidden></p>
    </main>
    <div id="app-menu" class="app-menu" hidden role="menu" aria-label="助手菜单">
      <button type="button" id="app-menu-settings" class="app-menu-item" role="menuitem">
        <svg class="app-menu-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2" />
        </svg>
        输入法设置
      </button>
      <button type="button" id="app-menu-toolbar" class="app-menu-item" role="menuitemcheckbox" aria-checked="false">
        <svg class="app-menu-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <path d="M21 9V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v10c0 1.1.9 2 2 2h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          <rect width="10" height="7" x="12" y="13" rx="2" fill="none" stroke="currentColor" stroke-width="2" />
        </svg>
        <span class="app-menu-label">展示工具栏</span>
        <span class="app-menu-switch" aria-hidden="true"></span>
      </button>
      <button type="button" id="app-menu-workdir" class="app-menu-item" role="menuitem">
        <svg class="app-menu-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <path d="m6 14 1.45-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        缓存目录
      </button>
      <div class="app-menu-about" role="group" aria-label="关于">
        <span class="app-menu-about-label">
          <svg class="app-menu-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2" />
            <path d="M12 16v-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            <path d="M12 8h.01" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
          关于
        </span>
        <span class="app-menu-about-meta">
          <span id="app-menu-version" class="app-menu-version"></span>
          <a
            id="app-menu-repo"
            class="app-menu-repo"
            hidden
            target="_blank"
            rel="noreferrer"
            aria-label="GitHub 仓库"
